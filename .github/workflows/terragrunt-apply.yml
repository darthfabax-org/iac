name: Terragrunt Apply IaC

on:
  push:
    branches:
    - main
    paths:
    - 'aws/**.hcl'
    - '!aws/_envcommon/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================
  # 1. CODE CHECKOUT & ENV SETUP
  # ===========================================
  set-env:
    name: Set Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  # ===========================================
  # 2. TERRAGRUNT PLAN
  # ===========================================
  terragrunt-plan:
    name: Terragrunt Plan Workflow
    needs: set-env
    uses: darthfabax-org/actions/.github/workflows/terragrunt-plan.yml@main
    secrets: inherit

  # ===========================================
  # 3. TERRAGRUNT APPLY
  # ===========================================
  terragrunt-apply:
    name: Terragrunt Apply Workflow
    needs: [terragrunt-plan, set-env]
    if: needs.terragrunt-plan.outputs.has_changes == 'true'
    uses: darthfabax-org/actions/.github/workflows/terragrunt-apply.yml@main
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.terragrunt-plan.outputs.matrix) }}
    with:
      working_directory: ${{ matrix.directory }}
    secrets: inherit
